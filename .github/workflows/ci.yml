name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version` input: pnpm/action-setup refuses when the version is
      # given both here and as `packageManager` in package.json, and
      # `packageManager` is the pin that also governs local development.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  # Consumers type-check earshot's sources with their own TypeScript, which is
  # not necessarily the one pinned here. This job is what keeps that promise
  # honest: the sources must compile on every TypeScript major still in use.
  typescript-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typescript: ['5', '6', '7']
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck with TypeScript ${{ matrix.typescript }}
        run: |
          pnpm add -D --no-frozen-lockfile "typescript@^${{ matrix.typescript }}"
          pnpm exec tsc --version
          pnpm exec tsc --noEmit
